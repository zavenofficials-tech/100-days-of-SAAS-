<!doctype html>
<html lang="en">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Practice Day1</title>
  <!-- THIS LINE CONNETS YOUR CSS FILE -->
  <link rel="stylesheet" href="style.css" />
  <!-- USING STYLE TAG FOR BUTTON 2 -->
  <style>
    #btn02 {
      background-color: blue;
    }
  </style>
  <body>
    <header>
      <!-- It's Background will be Blue -->
      <div id="box">
        <h1>This is Day 1 of learning CSS.</h1>
      </div>
      <!-- These headings are in Red -->
      <h2 class="headings">I have learned HTML.</h2>
      <h3 class="headings">Now, I am learning CSS.</h3>
      <h4 class="headings">After CSS, I will learn JavaScript.</h4>
    </header>
    <main>
      <!-- THIS IS GREEN USING CSS STYLESHEET -->
      <button type="button" id="btn01">Click Me</button>
      <!-- THIS IS BLUE USING <STYLE> TAG -->
      <button type="button" id="btn02">Click Me</button>
      <!-- THIS IS PINK USING INLINE STYLE -->
      <button type="button" id="btn03" style="background-color: pink">
        Click Me
      </button>
    </main>
    <footer>&copy; 2026 Zaven. All right reserved.</footer>
  </body>
</html>
