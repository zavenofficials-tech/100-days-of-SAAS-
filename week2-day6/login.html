<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
  </head>
  <body>
    <header>
      <center>
        <br />
        <br />
        <img
          src="z.png"
          alt="Zaven's Profile"
          width="150"
          height="25"
          align="center"
        />
      </center>
      <h2 align="center" style="color: black">
        <strong>Login to Zaven's Profile</strong>
      </h2>
    </header>
    <main>
      <form ation="profile.html">
        <center>
          <!-- Text Input -->
          <label for="name" style="color: black">Username:</label>
          <input type="text" id="name" placeholder="Enter Username" required />
          <br /><br />
          <!-- Email Input -->
          <label for="email" style="color: black">Email:</label>
          <input
            type="email"
            id="email"
            placeholder="email@gmail.com"
            required
          />
          <br /><br />
          <!-- Password Input -->
          <label for="password" style="color: black" required>Password:</label>
          <input type="password" style="color: black" required />
          <br /><br />
          <!-- Login Button -->
          <button
            type="submit"
            style="
              background-color: #4f46e5;
              color: white;
              padding: 12px 30px;
              border: none;
              border-radius: 8px;
              font-size: 16px;
              cursor: pointer;
            "
          >
            Login
          </button>
        </center>
      </form>
    </main>
    <hr />
    <footer>
      <center>
        <p><i>&copy; 2026 Zaven. All rights reserved.</i></p>
      </center>
    </footer>
  </body>
</html>
